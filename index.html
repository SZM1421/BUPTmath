<script>
/* ================= 留言板（Twikoo）配置 =================
 * 后端是自建的 Twikoo 服务，地址如下（已备案子域名 + HTTPS）。
 * 如需换地址，只改 TWIKOO_ENV 即可。
 * ===================================================== */
var TWIKOO_ENV  = "https://waline.sybuscloud.top";
var TWIKOO_PATH = "/guestbook";   // 全站共用一个留言板

(function () {
  var btn = document.getElementById("gbBtn");
  var panel = document.getElementById("gbPanel");
  var mask = document.getElementById("gbMask");
  var closeBtn = document.getElementById("gbClose");
  var statusEl = document.getElementById("gbStatus");
  var inited = false;
  var CDN = [
    "https://cdn.jsdelivr.net/npm/twikoo@1/dist/twikoo.min.js",
    "https://unpkg.com/twikoo@1/dist/twikoo.min.js",
    "https://fastly.jsdelivr.net/npm/twikoo@1/dist/twikoo.min.js"
  ];

  function open() {
    panel.classList.add("open");
    mask.classList.add("on");
    panel.setAttribute("aria-hidden", "false");
    init();
  }
  function close() {
    panel.classList.remove("open");
    mask.classList.remove("on");
    panel.setAttribute("aria-hidden", "true");
  }
  function loadScript(i) {
    if (i >= CDN.length) {
      statusEl.textContent = "留言组件加载失败，请检查网络后刷新重试。";
      return;
    }
    var s = document.createElement("script");
    s.src = CDN[i];
    s.async = true;
    s.onload = function () { if (window.twikoo) start(); else loadScript(i + 1); };
    s.onerror = function () { loadScript(i + 1); };
    document.head.appendChild(s);
  }
  function init() {
    if (inited) return;
    inited = true;
    if (window.twikoo) { start(); return; }
    statusEl.textContent = "正在加载留言组件…";
    loadScript(0);
  }
  function start() {
    statusEl.textContent = "";
    if (!window.twikoo) return;
    window.twikoo.init({
      el: "#vcomments",
      envId: TWIKOO_ENV,
      path: TWIKOO_PATH,
      lang: "zh-CN"
    });
  }

  if (btn) btn.addEventListener("click", open);
  if (closeBtn) closeBtn.addEventListener("click", close);
  if (mask) mask.addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();
</script>
